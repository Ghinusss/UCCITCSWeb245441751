<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
    <link rel="stylesheet" href="Survey_Form.css" />
  </head>
  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">
      Please fill out this survey to help us improve the freeCodeCamp experience.
    </p>

    <form id="survey-form">

      <!-- Name -->
      <label for="name" id="name-label">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required />

      <!-- Email -->
      <label for="email" id="email-label">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your Email" required />

      <!-- Age -->
      <label for="number" id="number-label">Age <span>(optional)</span></label>
      <input type="number" id="number" name="age" placeholder="Age" min="10" max="120" />

      <!-- Current Role -->
      <label for="dropdown">Which option best describes your current role?</label>
      <select id="dropdown" name="role" required>
        <option value="" disabled selected>Select current role</option>
        <option value="student">Student</option>
        <option value="full-time-job">Full Time Job</option>
        <option value="part-time-job">Part Time Job</option>
        <option value="prefer-not-say">Prefer not to say</option>
        <option value="other">Other</option>
      </select>

      <!-- Recommend freeCodeCamp -->
      <p>Would you recommend freeCodeCamp to a friend?</p>
      <label>
        <input type="radio" name="recommend" value="definitely" required />Definitely
      </label>
      <label>
        <input type="radio" name="recommend" value="maybe" />Maybe
      </label>
      <label>
        <input type="radio" name="recommend" value="not-sure" />Not sure
      </label>

      <!-- Favorite Feature -->
      <label for="feature">What is your favorite feature of freeCodeCamp?</label>
      <select id="feature" name="feature" required>
        <option value="" disabled selected>Select an option</option>
        <option value="challenges">Challenges</option>
        <option value="projects">Projects</option>
        <option value="videos">Videos</option>
        <option value="community">Community</option>
      </select>

      <!-- Improvements -->
      <p>What would you like to see improved? (Check all that apply)</p>
      <label>
        <input type="checkbox" name="improve" value="front-end-projects" />Front-end Projects
      </label>
      <label>
        <input type="checkbox" name="improve" value="back-end-projects" />Back-end Projects
      </label>
      <label>
        <input type="checkbox" name="improve" value="data-visualization" />Data Visualization
      </label>
      <label>
        <input type="checkbox" name="improve" value="challenges" />Challenges
      </label>
      <label>
        <input type="checkbox" name="improve" value="open-source-community" />Open Source Community
      </label>
      <label>
        <input type="checkbox" name="improve" value="gitter-help-rooms" />Gitter help rooms
      </label>
      <label>
        <input type="checkbox" name="improve" value="videos" />Videos
      </label>
      <label>
        <input type="checkbox" name="improve" value="city-meetups" />City Meetups
      </label>
      <label>
        <input type="checkbox" name="improve" value="wiki" />Wiki
      </label>
      <label>
        <input type="checkbox" name="improve" value="forum" />Forum
      </label>
      <label>
        <input type="checkbox" name="improve" value="additional-courses" />Additional Courses
      </label>

      <!-- Additional Comments -->
      <label for="comments">Any comments or suggestions?</label>
      <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Enter your comment here..."></textarea>

      <!-- Submit -->
      <button type="submit" id="submit">Submit</button>
    </form>
  </body>
</html>
